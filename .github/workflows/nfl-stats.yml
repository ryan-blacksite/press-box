# NFL stats from nflverse (CC BY 4.0, credit and licence link are inside every file). Downloads the season file, slices it into small
# per-game and per-team JSON files, and publishes them with GitHub Pages: https://ryan-blacksite.github.io/press-box/nfl/<season>/...
# Every 3 hours; nflverse itself updates after games (usually by the next morning US time), so most runs change nothing. No commits are made.
name: NFL stats

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nfl-stats
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ryan-blacksite/press-box'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vite-node src/nfl/main.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
